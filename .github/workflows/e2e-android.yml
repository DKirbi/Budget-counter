# Runs the Maestro E2E flows (apps/mobile/.maestro) on an Android emulator against the freshly built APK.
# Nightly, on demand, or on any PR labelled "e2e". Emulator runs are slow (~15 min), so they are not on every push.
name: E2E · Android (Maestro)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/android-apk.yml
    permissions:
      contents: write

  maestro:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: dist
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r dist/app-release.apk
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml --test-output-dir maestro-output

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-results-api${{ matrix.api-level }}
          path: |
            maestro-report.xml
            maestro-output
