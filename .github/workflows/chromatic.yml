# Optional visual regression review of every story (light + dark) with Chromatic.
# Enable: create a project at chromatic.com, add the repo secret CHROMATIC_PROJECT_TOKEN. Without it the job is skipped.
# A token change that shifts pixels shows up here as a diff to approve — the "did my design change break anything?" gate.
name: Chromatic

on:
  pull_request:
    paths:
      - 'packages/tokens/**'
      - 'packages/ui-native/**'
      - 'packages/screens-native/**'
      - 'apps/storybook/**'

permissions:
  contents: read

jobs:
  chromatic:
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build
          exitOnceUploaded: true
